name: 构建并推送到Docker Hub

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # Docker Hub配置
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  DOCKER_REPOSITORY: kobex95/rybbit

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置QEMU（多架构支持）
      uses: docker/setup-qemu-action@v3

    - name: 设置Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 登录到Docker Hub
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}

    - name: 提取镜像标签
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_REPOSITORY }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=ref,event=pr
          type=sha,prefix=,suffix=,format=short
          type=raw,value=latest,enable={{is_default_branch}}

    # 构建共享包
    - name: 构建共享包
      run: |
        cd shared
        npm ci
        npm run build

    # 构建并推送Client镜像
    - name: 构建Client镜像
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./client/Dockerfile
        push: true
        tags: |
          ${{ env.DOCKER_REPOSITORY }}-client:${{ steps.meta.outputs.version }}
          ${{ env.DOCKER_REPOSITORY }}-client:latest
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 构建并推送Server镜像
    - name: 构建Server镜像
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./server/Dockerfile
        push: true
        tags: |
          ${{ env.DOCKER_REPOSITORY }}-server:${{ steps.meta.outputs.version }}
          ${{ env.DOCKER_REPOSITORY }}-server:latest
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 构建并推送Monitor Agent镜像
    - name: 构建Monitor Agent镜像
      uses: docker/build-push-action@v5
      with:
        context: ./monitor-agent
        file: ./monitor-agent/Dockerfile
        push: true
        tags: |
          ${{ env.DOCKER_REPOSITORY }}-monitor-agent:${{ steps.meta.outputs.version }}
          ${{ env.DOCKER_REPOSITORY }}-monitor-agent:latest
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 输出构建信息
    - name: 输出构建摘要
      run: |
        echo "✅ Docker镜像已成功推送到Docker Hub"
        echo "Client镜像: docker.io/${{ env.DOCKER_REPOSITORY }}-client:${{ steps.meta.outputs.version }}"
        echo "Server镜像: docker.io/${{ env.DOCKER_REPOSITORY }}-server:${{ steps.meta.outputs.version }}"
        echo "Monitor Agent镜像: docker.io/${{ env.DOCKER_REPOSITORY }}-monitor-agent:${{ steps.meta.outputs.version }}"
        echo "Latest标签镜像已同步更新"