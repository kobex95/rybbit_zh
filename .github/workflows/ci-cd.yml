name: CI/CD流水线

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rybbit

jobs:
  # 代码质量检查
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          client/package-lock.json
          server/package-lock.json
          shared/package-lock.json

    - name: 安装依赖
      run: |
        cd shared && npm ci
        cd ../client && npm ci
        cd ../server && npm ci

    - name: 运行ESLint检查
      run: |
        cd client && npm run lint
        cd ../server && npm run build

  # 单元测试
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 安装依赖
      run: |
        cd shared && npm ci && npm run build
        cd ../server && npm ci

    - name: 运行测试
      run: |
        cd server && npm run test:run

  # Docker镜像构建和推送
  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置QEMU
      uses: docker/setup-qemu-action@v3

    - name: 设置Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 登录到GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 提取Docker镜像元数据
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-client
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-server
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-monitor-agent
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=ref,event=pr
          type=sha,prefix=,suffix=,format=short
          type=raw,value=latest,enable={{is_default_branch}}

    # 构建共享包
    - name: 构建共享包
      run: |
        cd shared
        npm ci
        npm run build

    # 构建Client镜像
    - name: 构建并推送Client镜像
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./client/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-client:${{ steps.meta.outputs.version }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-client:latest
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 构建Server镜像
    - name: 构建并推送Server镜像
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./server/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-server:${{ steps.meta.outputs.version }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-server:latest
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 构建Monitor Agent镜像
    - name: 构建并推送Monitor Agent镜像
      uses: docker/build-push-action@v5
      with:
        context: ./monitor-agent
        file: ./monitor-agent/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-monitor-agent:${{ steps.meta.outputs.version }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-monitor-agent:latest
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 输出构建信息
    - name: 输出构建摘要
      run: |
        echo "✅ Docker镜像构建完成"
        echo "Client镜像: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-client:${{ steps.meta.outputs.version }}"
        echo "Server镜像: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-server:${{ steps.meta.outputs.version }}"
        echo "Monitor Agent镜像: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-monitor-agent:${{ steps.meta.outputs.version }}"